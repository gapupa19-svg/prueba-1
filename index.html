<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OPE Sprint · Medicina Interna</title>
<style>
:root{--green:#58cc02;--green2:#46a302;--blue:#1cb0f6;--yellow:#ffc800;--red:#ff4b4b;--ink:#2b2b2b;--muted:#777;--line:#e5e5e5;--bg:#f7f7f7;--card:#fff;--soft:#eefbe6;--shadow:0 4px 0 #d8d8d8}
*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,"SF Pro Rounded","Nunito",Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}
.topbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:2px solid #eee}.top-inner{max-width:1240px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;color:var(--green2);white-space:nowrap}.brand-badge{width:38px;height:38px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:white;box-shadow:0 4px 0 #3f9900}.stats{margin-left:auto;display:flex;gap:12px;align-items:center}.pill{border:2px solid #eee;background:#fff;padding:8px 12px;border-radius:999px;font-weight:800;color:#666}.pill b{color:#333}.tabs-wrap{background:#fff;overflow:auto;border-bottom:1px solid #eee}.tabs{max-width:1240px;margin:auto;padding:0 20px;display:flex;gap:8px;min-width:max-content}.tab{border:0;background:transparent;padding:12px 14px;font-weight:850;color:#777;border-bottom:4px solid transparent;cursor:pointer}.tab.active{color:var(--green2);border-color:var(--green)}
.shell{max-width:1240px;margin:0 auto;padding:28px 20px 64px}.hero{background:linear-gradient(135deg,#58cc02,#7ee12d);color:white;border-radius:24px;padding:26px 28px;box-shadow:0 6px 0 #42a000;margin-bottom:26px}.hero h1{margin:0 0 6px;font-size:31px}.hero p{margin:0;opacity:.95;font-weight:650}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:900;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;transition:.12s}.btn:active{transform:translateY(2px)}.btn-primary{background:var(--green);color:#fff;box-shadow:0 4px 0 #3e9a00}.btn-secondary{background:#fff;color:#555;border:2px solid #e5e5e5;box-shadow:0 3px 0 #ddd}.btn-danger{background:var(--red);color:#fff;box-shadow:0 4px 0 #d83838}.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}.section-title{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:22px 2px 12px}.section-title h2{margin:0;font-size:22px}.section-title span{color:#888;font-weight:700}.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.theme-card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}.theme-card:hover{transform:translateY(-2px);border-color:#cfcfcf}.theme-top{display:flex;align-items:center;gap:12px}.theme-icon{width:48px;height:48px;border-radius:16px;background:#efffe4;display:grid;place-items:center;font-size:24px}.theme-card h3{margin:0;font-size:17px;line-height:1.25}.theme-card p{margin:8px 0 0;color:#777;font-weight:700}.mini-progress{height:10px;border-radius:99px;background:#eee;overflow:hidden;margin-top:14px}.mini-progress>div{height:100%;background:var(--green);width:0}
.quiz{max-width:850px;margin:0 auto}.progress-row{display:flex;gap:12px;align-items:center;margin:6px 0 22px}.progress{height:16px;border-radius:99px;background:#e5e5e5;overflow:hidden;flex:1}.progress>div{height:100%;background:var(--green);transition:.25s}.counter{font-weight:900;color:#777;white-space:nowrap}.qcard{background:#fff;border:2px solid #e6e6e6;border-radius:24px;padding:26px;box-shadow:0 5px 0 #ddd}.qmeta{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.7px;color:var(--blue);margin-bottom:12px}.question{font-size:22px;line-height:1.42;font-weight:800;margin:0 0 20px}.options{display:grid;gap:11px}.option{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:2px solid #ddd;background:white;border-radius:16px;padding:14px 15px;cursor:pointer;box-shadow:0 3px 0 #ddd;font-weight:750;line-height:1.35}.option:hover:not(.locked){background:#f7fbff;border-color:#a8dff9}.key{min-width:30px;height:30px;border:2px solid #ddd;border-radius:9px;display:grid;place-items:center;font-weight:900;color:#777;background:#fafafa}.option.correct{border-color:#58cc02;background:#efffdc;box-shadow:0 3px 0 #48a900}.option.wrong{border-color:#ff4b4b;background:#fff0f0;box-shadow:0 3px 0 #d83a3a}.option.correct .key{border-color:#58cc02;color:#369400}.option.wrong .key{border-color:#ff4b4b;color:#d83434}.feedback{margin-top:18px;border-radius:18px;padding:18px;display:none}.feedback.show{display:block}.feedback.ok{background:#dff8cf;border:2px solid #b6ec96}.feedback.bad{background:#ffe1e1;border:2px solid #ffb1b1}.feedback-title{font-size:20px;font-weight:950;margin-bottom:7px}.explanation{white-space:pre-wrap;line-height:1.55;color:#444}.quiz-actions{display:flex;justify-content:flex-end;margin-top:16px}.end{max-width:760px;margin:20px auto;background:#fff;border:2px solid #e5e5e5;border-radius:24px;padding:30px;text-align:center;box-shadow:0 5px 0 #ddd}.end-emoji{font-size:64px}.end h2{font-size:30px;margin:8px 0}.score-big{font-size:48px;font-weight:950;color:var(--green2)}.end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.metric{background:#f7f7f7;border-radius:16px;padding:14px}.metric b{font-size:23px;display:block}.metric span{color:#777;font-weight:700}.empty{padding:40px;text-align:center;color:#777;background:#fff;border:2px dashed #ddd;border-radius:20px}.small{font-size:13px;color:#888}.hidden{display:none!important}@media(max-width:650px){.top-inner{padding:10px 14px}.brand span:last-child{display:none}.shell{padding:20px 14px 46px}.hero{padding:20px}.hero h1{font-size:25px}.qcard{padding:19px}.question{font-size:19px}.end-grid{grid-template-columns:1fr}.stats .pill:nth-child(2){display:none}.tab{padding:11px 10px;font-size:13px}}
</style>
</head>
<body>
<header class="topbar"><div class="top-inner"><div class="brand"><span class="brand-badge">🩺</span><span>OPE Sprint</span></div><div class="stats"><span class="pill">🔥 <b id="streakTop">0</b></span><span class="pill">⭐ <b id="xpTop">0</b> XP</span></div></div><div class="tabs-wrap"><nav class="tabs" id="tabs"></nav></div></header>
<main class="shell" id="app"><section class="hero" id="bootStatus"><h1>🩺 OPE Sprint</h1><p>Cargando banco de preguntas…</p></section></main>
<script>
let QUESTIONS=[];
const SPECIALTY_META={
'Digestivo':['🫃','Digestivo'],'Neumología':['🫁','Neumología'],'Nefrología':['🧪','Nefrología'],'Cardiología':['❤️','Cardiología'],'Reumatología':['🦴','Reumatología'],'Infecciosas':['🦠','Infecciosas'],'Endocrinología':['🧬','Endocrinología'],'Neurología':['🧠','Neurología'],'Hematología':['🩸','Hematología'],'Onco-Hematología':['🎗️','Onco-Hematología'],'Obesidad y Nutrición':['⚖️','Obesidad y Nutrición']};
const order=['Cardiología','Neumología','Nefrología','Digestivo','Reumatología','Infecciosas','Endocrinología','Neurología','Hematología','Onco-Hematología','Obesidad y Nutrición'];
let specialty=order[0], session=null, sessionWrong=[], current=0, answered=false, streak=0, xp=0;
function safeStorageGet(key){try{return window.localStorage?localStorage.getItem(key):null}catch(e){console.warn('localStorage no disponible:',e);return null}}
function safeStorageSet(key,value){try{if(window.localStorage)localStorage.setItem(key,value);return true}catch(e){console.warn('No se pudo guardar en localStorage:',e);return false}}
let saved={};try{saved=JSON.parse(safeStorageGet('opeSprintStats')||'{}')||{}}catch(e){console.warn('Datos locales inválidos; se reinician estadísticas:',e);saved={}}
function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));}
function setStats(){document.getElementById('streakTop').textContent=streak;document.getElementById('xpTop').textContent=xp;}
function renderTabs(){const el=document.getElementById('tabs');el.innerHTML=order.map(s=>`<button class="tab ${s===specialty?'active':''}" data-s="${esc(s)}">${SPECIALTY_META[s][0]} ${esc(s)}</button>`).join('');el.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{specialty=b.dataset.s;session=null;renderTabs();renderHome();});}
function groupsFor(s){const arr=QUESTIONS.filter(q=>q.specialty===s);const m=new Map();for(const q of arr){const key=q.theme_num?`TEMA ${q.theme_num}`:'Banco completo';if(!m.has(key))m.set(key,{key,title:q.theme||s,theme_num:q.theme_num,qs:[]});m.get(key).qs.push(q);}return [...m.values()].sort((a,b)=>(a.theme_num??999)-(b.theme_num??999));}
function renderHome(){streak=0;xp=0;setStats();const app=document.getElementById('app'), groups=groupsFor(specialty), total=groups.reduce((n,g)=>n+g.qs.length,0), icon=SPECIALTY_META[specialty][0];app.innerHTML=`<section class="hero"><h1>${icon} ${esc(specialty)}</h1><p>${total} preguntas disponibles · respuesta inmediata, justificación y repaso de fallos.</p></section><div class="toolbar"><button class="btn btn-primary" id="allBtn">Empezar especialidad completa</button><button class="btn btn-secondary" id="randomBtn">🔀 20 aleatorias</button></div><div class="section-title"><h2>Elige un tema</h2><span>${groups.length} bloque${groups.length===1?'':'s'}</span></div><div class="theme-grid">${groups.map(g=>{const k=specialty+'|'+g.key,done=(saved[k]?.answered||0),pct=Math.min(100,Math.round(done/g.qs.length*100));return `<article class="theme-card" data-key="${esc(g.key)}"><div class="theme-top"><div class="theme-icon">${icon}</div><div><h3>${(g.theme_num&&g.title!=='Extra')?`Tema ${g.theme_num} · `:''}${esc(g.title)}</h3><p>${g.qs.length} preguntas</p></div></div><div class="mini-progress"><div style="width:${pct}%"></div></div><p class="small">Progreso guardado: ${Math.min(done,g.qs.length)}/${g.qs.length}</p></article>`}).join('')}</div>`;
document.getElementById('allBtn').onclick=()=>startQuiz(QUESTIONS.filter(q=>q.specialty===specialty),specialty+' · completa');document.getElementById('randomBtn').onclick=()=>startQuiz(shuffle([...QUESTIONS.filter(q=>q.specialty===specialty)]).slice(0,20),specialty+' · 20 aleatorias');document.querySelectorAll('.theme-card').forEach(c=>c.onclick=()=>{const g=groups.find(x=>x.key===c.dataset.key);startQuiz(g.qs,`${g.key} · ${g.title}`)});}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(qs,label){session={qs:[...qs],label,correct:0,wrong:0,answered:0};sessionWrong=[];current=0;answered=false;streak=0;xp=0;setStats();renderQuestion();window.scrollTo({top:0,behavior:'smooth'});}
function renderQuestion(){if(!session)return renderHome();if(current>=session.qs.length)return renderEnd();const q=session.qs[current], pct=Math.round(current/session.qs.length*100), app=document.getElementById('app');app.innerHTML=`<div class="quiz"><div class="progress-row"><button class="btn btn-secondary" id="exitBtn">← Temario</button><div class="progress"><div style="width:${pct}%"></div></div><span class="counter">${current+1}/${session.qs.length}</span></div><div class="qcard"><div class="qmeta">${esc(session.label)}${q.theme_num?` · TEMA ${q.theme_num}`:''}</div><h2 class="question">${esc(q.question)}</h2><div class="options" id="opts">${q.options.map((o,i)=>`<button class="option" data-letter="${o.letter}"><span class="key">${i+1}</span><span><b>${o.letter}.</b> ${esc(o.text)}</span></button>`).join('')}</div><div id="feedback" class="feedback"><div class="feedback-title" id="fbTitle"></div><div class="explanation" id="fbText"></div></div><div class="quiz-actions"><button class="btn btn-primary hidden" id="nextBtn">Continuar →</button></div></div></div>`;
document.getElementById('exitBtn').onclick=()=>{session=null;renderHome()};document.querySelectorAll('.option').forEach(b=>b.onclick=()=>choose(b.dataset.letter));document.getElementById('nextBtn').onclick=next;}
function choose(letter){if(answered)return;answered=true;const q=session.qs[current],ok=letter===q.correct;session.answered++;if(ok){session.correct++;streak++;xp+=10}else{session.wrong++;streak=0;sessionWrong.push(q)}setStats();document.querySelectorAll('.option').forEach(b=>{b.classList.add('locked');if(b.dataset.letter===q.correct)b.classList.add('correct');if(b.dataset.letter===letter&&!ok)b.classList.add('wrong');});const fb=document.getElementById('feedback');fb.className='feedback show '+(ok?'ok':'bad');document.getElementById('fbTitle').textContent=ok?'✅ ¡Correcto!':`❌ Incorrecto · la respuesta correcta es ${q.correct}`;document.getElementById('fbText').textContent=q.explanation||'El documento fuente no incluye una justificación textual para este ítem.';document.getElementById('nextBtn').classList.remove('hidden');}
function next(){const q=session.qs[current];const key=specialty+'|'+(q.theme_num?`TEMA ${q.theme_num}`:'Banco completo');saved[key]=saved[key]||{answered:0,correct:0};saved[key].answered++;if(q.correct)saved[key].correct+=1;safeStorageSet('opeSprintStats',JSON.stringify(saved));current++;answered=false;renderQuestion();window.scrollTo({top:0,behavior:'smooth'});}
function renderEnd(){const app=document.getElementById('app'),n=session.qs.length,pct=n?Math.round(session.correct/n*100):0,wrong=[...sessionWrong];app.innerHTML=`<section class="end"><div class="end-emoji">${pct>=90?'🏆':pct>=70?'💪':'📚'}</div><h2>Test completado</h2><div class="score-big">${pct}%</div><div class="end-grid"><div class="metric"><b>${session.correct}</b><span>Aciertos</span></div><div class="metric"><b>${session.wrong}</b><span>Fallos</span></div><div class="metric"><b>${xp}</b><span>XP</span></div></div><div class="toolbar" style="justify-content:center"><button class="btn btn-danger" id="retryWrong" ${wrong.length?'':'disabled'}>↻ Repetir falladas desde cero (${wrong.length})</button><button class="btn btn-secondary" id="retryAll">Repetir test completo</button><button class="btn btn-secondary" id="homeBtn">Volver al temario</button></div></section>`;document.getElementById('retryWrong').onclick=()=>{if(wrong.length)startQuiz(wrong,'Repaso de falladas')};document.getElementById('retryAll').onclick=()=>startQuiz(session.qs,session.label);document.getElementById('homeBtn').onclick=()=>{session=null;renderHome()};}
window.addEventListener('keydown',e=>{if(!session||current>=session.qs.length)return;if(!answered&&/^[1-6]$/.test(e.key)){const b=document.querySelectorAll('.option')[Number(e.key)-1];if(b)b.click()}else if(answered&&(e.key==='Enter'||e.key===' ')){e.preventDefault();document.getElementById('nextBtn')?.click();}});
async function boot(){
  const app=document.getElementById('app');
  try{
    if(app){app.innerHTML=`<section class="end"><div class="end-emoji">⏳</div><h2>Cargando OPE Sprint…</h2><p class="small">Preparando el banco de preguntas.</p></section>`;}
    const response=await fetch('./questions.json', {cache:'no-store'});
    if(!response.ok) throw new Error(`No se pudo cargar questions.json (HTTP ${response.status})`);
    QUESTIONS=await response.json();
    if(!Array.isArray(QUESTIONS)||QUESTIONS.length===0)throw new Error('El banco de preguntas está vacío o no es válido.');
    renderTabs();
    renderHome();
  }catch(err){
    console.error('Error al iniciar OPE Sprint:',err);
    if(app){app.innerHTML=`<section class="end"><div class="end-emoji">⚠️</div><h2>No se pudo iniciar la aplicación</h2><p style="line-height:1.6;color:#555">${esc(err&&err.message?err.message:String(err))}</p><p class="small">Comprueba que <b>questions.json</b> esté subido en la misma carpeta que <b>index.html</b>.</p></section>`;}
  }
}
boot();
</script>
</body></html>
